# Étalonnage de la note « à voir » (docs/note.js) sur les vrais matchs ESPN : à lancer à la main (onglet Actions)
# quand on retouche les règles ou les seuils ; affiche chaque match, sa note et la répartition par niveau.
name: Étalonnage des notes
on:
  workflow_dispatch:
    inputs:
      debut:
        description: "Première nuit (AAAAMMJJ)"
        default: "20261020"
jobs:
  calib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/notes_calib.js ${{ inputs.debut }}
