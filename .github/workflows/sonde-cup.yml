# Sonde ponctuelle (28/11) : données de la NBA Cup chez ESPN et la NBA. Lancée à chaque envoi de ce fichier ou du script.
name: Sonde NBA Cup
on:
  push:
    paths: [".github/workflows/sonde-cup.yml", "scripts/sonde_cup.js"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sonde_cup.js
